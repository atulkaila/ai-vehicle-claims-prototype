name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/vehicle-claims-ui
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/vehicle-claims-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Placeholder — the build must not require a real key. The route handler
          # is executed at request time, not build time.
          OPENAI_API_KEY: ci-placeholder-not-used-at-build-time
